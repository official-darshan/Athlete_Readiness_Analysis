services:
  api:
    build: .
    image: athlete-readiness:latest
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    build: .
    image: athlete-readiness:latest
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./data:/app/data:ro
    depends_on:
      api:
        condition: service_healthy
